name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: BZWorkshopUploader.exe
          - os: ubuntu-latest
            platform: linux
            artifact_name: BZWorkshopUploader
          - os: macos-latest
            platform: macos
            artifact_name: BZWorkshopUploader

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Generate canonical app icon
      run: |
        python scripts/generate_app_icon.py branding/repo_icon.svg branding/app_icon.ico --png branding/app_icon.png

    - name: Resolve package version
      id: version
      shell: bash
      run: |
        if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
          version="${GITHUB_REF_NAME#v}"
        else
          version="$(tr -d '[:space:]' < VERSION)"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Generate Windows version metadata
      if: matrix.os == 'windows-latest'
      run: |
        python scripts/generate_version_info.py --version "${{ steps.version.outputs.version }}" --output branding/version_info.txt

    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        python -m PyInstaller --noconfirm --onefile --windowed --name "BZWorkshopUploader" --icon "branding/app_icon.ico" --version-file "branding/version_info.txt" --add-data "branding/app_icon.ico;branding" --add-data "branding/app_icon.png;branding" --add-data "BZONE.ttf;." --add-data "bzrODFparams.txt;." --add-data "odfHeaderList.txt;." --runtime-hook branding/pyinstaller_icon_hook.py uploader.py

    - name: Build with PyInstaller (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        python -m PyInstaller --noconfirm --onefile --windowed --name "BZWorkshopUploader" --icon "branding/app_icon.ico" --add-data "branding/app_icon.ico:branding" --add-data "branding/app_icon.png:branding" --add-data "BZONE.ttf:." --add-data "bzrODFparams.txt:." --add-data "odfHeaderList.txt:." --runtime-hook branding/pyinstaller_icon_hook.py uploader.py

    - name: Build with PyInstaller (MacOS)
      if: matrix.os == 'macos-latest'
      run: |
        python -m PyInstaller --noconfirm --onefile --windowed --name "BZWorkshopUploader" --icon "branding/app_icon.ico" --add-data "branding/app_icon.ico:branding" --add-data "branding/app_icon.png:branding" --add-data "BZONE.ttf:." --add-data "bzrODFparams.txt:." --add-data "odfHeaderList.txt:." --runtime-hook branding/pyinstaller_icon_hook.py uploader.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Battlezone98Redux_WorkshopUploader-${{ matrix.platform }}
        path: dist/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    if: "${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release): v')) }}"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Resolve release tag
      id: release_version
      shell: bash
      run: |
        if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
          tag="$GITHUB_REF_NAME"
        else
          tag="v$(tr -d '[:space:]' < VERSION)"
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts

    - name: Package versioned release archives
      shell: bash
      env:
        RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
      run: |
        set -euo pipefail
        mkdir -p release-packages/windows release-packages/linux release-packages/macos

        cp release-artifacts/Battlezone98Redux_WorkshopUploader-windows/BZWorkshopUploader.exe release-packages/windows/
        cp release-artifacts/Battlezone98Redux_WorkshopUploader-linux/BZWorkshopUploader release-packages/linux/
        cp release-artifacts/Battlezone98Redux_WorkshopUploader-macos/BZWorkshopUploader release-packages/macos/

        chmod +x release-packages/linux/BZWorkshopUploader release-packages/macos/BZWorkshopUploader

        (cd release-packages/windows && zip -q ../Battlezone98Redux_WorkshopUploader-${RELEASE_TAG}-windows.zip BZWorkshopUploader.exe)
        (cd release-packages/linux && tar -czf ../Battlezone98Redux_WorkshopUploader-${RELEASE_TAG}-linux.tar.gz BZWorkshopUploader)
        (cd release-packages/macos && tar -czf ../Battlezone98Redux_WorkshopUploader-${RELEASE_TAG}-macos.tar.gz BZWorkshopUploader)

        ls -lh release-packages/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_version.outputs.tag }}
        name: ${{ steps.release_version.outputs.tag }}
        target_commitish: ${{ github.sha }}
        files: |
          release-packages/Battlezone98Redux_WorkshopUploader-v*-windows.zip
          release-packages/Battlezone98Redux_WorkshopUploader-v*-linux.tar.gz
          release-packages/Battlezone98Redux_WorkshopUploader-v*-macos.tar.gz
        fail_on_unmatched_files: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
